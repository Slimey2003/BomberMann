<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges">
  <defs>
    <filter id="rangeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="64" height="64" fill="#08090d" />
  <rect x="2" y="2" width="60" height="60" fill="#181b26" />
  <rect x="4" y="4" width="56" height="56" fill="#007a99" />

  <polygon points="4,4 12,4 4,12" fill="#4f3f26" />
  <polygon points="60,4 52,4 60,12" fill="#4f3f26" />
  <polygon points="4,60 12,60 4,52" fill="#332817" />
  <polygon points="60,60 52,60 60,52" fill="#332817" />
  <rect x="6" y="6" width="3" height="3" fill="#d4af37" />
  <rect x="55" y="6" width="3" height="3" fill="#d4af37" />
  <rect x="6" y="55" width="3" height="3" fill="#997819" />
  <rect x="55" y="55" width="3" height="3" fill="#997819" />

  <circle cx="32" cy="32" r="20" fill="#261007" stroke="#422013" stroke-width="1.5" />

  <g filter="url(#rangeGlow)">
    <line x1="32" y1="12" x2="32" y2="52" stroke="#ff6a00" stroke-width="2" />
    <line x1="12" y1="32" x2="52" y2="32" stroke="#ff6a00" stroke-width="2" />
    <line x1="32" y1="16" x2="32" y2="48" stroke="#ffe066" stroke-width="1" />
    <line x1="16" y1="32" x2="48" y2="32" stroke="#ffe066" stroke-width="1" />

    <polygon points="32,8 37,16 27,16" fill="#ff4800" stroke="#ffe066" stroke-width="1" />
    <polygon points="32,56 37,48 27,48" fill="#ff4800" stroke="#ffe066" stroke-width="1" />
    <polygon points="8,32 16,27 16,37" fill="#ff4800" stroke="#ffe066" stroke-width="1" />
    <polygon points="56,32 48,27 48,37" fill="#ff4800" stroke="#ffe066" stroke-width="1" />

    <circle cx="32" cy="32" r="4" fill="#ffaa00" />
    <circle cx="32" cy="32" r="2" fill="#ffffff" />
  </g>

  <rect x="23" y="23" width="2" height="2" fill="#ff944d" />
  <rect x="39" y="23" width="2" height="2" fill="#ff944d" />
  <rect x="23" y="39" width="2" height="2" fill="#ff944d" />
  <rect x="39" y="39" width="2" height="2" fill="#ff944d" />
</svg>
