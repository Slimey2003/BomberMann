services:
  database:
    image: postgres:16-alpine
    container_name: bombermann-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_GAME_USER: ${POSTGRES_GAME_USER}
      POSTGRES_GAME_PASSWORD: ${POSTGRES_GAME_PASSWORD}
      POSTGRES_GAME_DB: ${POSTGRES_GAME_DB}
      POSTGRES_KC_USER: ${POSTGRES_KC_USER}
      POSTGRES_KC_PASSWORD: ${POSTGRES_KC_PASSWORD}
      POSTGRES_KC_DB: ${POSTGRES_KC_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db_init.sh:/docker-entrypoint-initdb.d/init.sh
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://database:5432/${POSTGRES_KC_DB}
      KC_DB_USERNAME: ${POSTGRES_KC_USER}
      KC_DB_PASSWORD: ${POSTGRES_KC_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak-realm-import.json:/opt/keycloak/data/import/realm.json
    depends_on:
      database:
        condition: service_healthy
  app:
    build: 
      context: .
      args:
        VITE_KC_GAME_ID: ${KC_GAME_ID}
        VITE_KC_REALM: ${KC_REALM}
        VITE_GAME_PORT: ${GAME_PORT}
        VITE_IS_DEV: ${IS_DEV}
    container_name: bombermann-app
    volumes:
      - ./backend:/app/backend
      - ./utils:/app/utils
      - /app/node_modules
      - /app/backend/public
    ports:
      - "${GAME_PORT}:${GAME_PORT}"
    depends_on:
      - database
    environment:
      FRONTEND_URL: "http://localhost:${GAME_PORT}"
      GAME_PORT: ${GAME_PORT}
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: ${POSTGRES_GAME_USER}
      DB_PASSWORD: ${POSTGRES_GAME_PASSWORD}
      DB_NAME: ${POSTGRES_GAME_DB}
      VITE_KC_GAME_ID: ${KC_GAME_ID}
      VITE_KC_REALM: ${KC_REALM}
      VITE_GAME_PORT: ${GAME_PORT}
      VITE_IS_DEV: ${IS_DEV}

      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
volumes:
  postgres_data: